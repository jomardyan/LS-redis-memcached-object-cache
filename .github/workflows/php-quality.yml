name: PHP quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, pdo_sqlite, zip
          coverage: none
      - name: Check PHP syntax
        run: php tools/php-lint.php smart-hybrid-cache
      - run: php tests/run.php && php tests/admin-regressions.php && php tests/release-regressions.php && php tools/validate-package.php
